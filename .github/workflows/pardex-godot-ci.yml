name: PARDEX Godot CI

on:
  push:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "themes/**"
      - ".github/workflows/pardex-godot-ci.yml"
  pull_request:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "themes/**"
      - ".github/workflows/pardex-godot-ci.yml"

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          csharp: false
          export-templates: false

      - name: Import PARDEX resources
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-import.log; then
            echo "::error::Godot import produced an error"
            exit 1
          fi

      - name: Validate PARDEX resources
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci/validate_project.gd 2>&1 | tee godot-validate.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-validate.log; then
            echo "::error::Godot resource validation produced an error"
            exit 1
          fi

      - name: Boot PARDEX headlessly
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci/boot_smoke.gd 2>&1 | tee godot-boot.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-boot.log; then
            echo "::error::Godot boot produced a script or runtime error"
            exit 1
          fi

      - name: Verify editor page preview layouts
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci/editor_preview_smoke.gd 2>&1 | tee godot-preview.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-preview.log; then
            echo "::error::Godot page preview validation produced an error"
            exit 1
          fi

      - name: Install software-rendering display
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Render PARDEX logo effects
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PARDEX_LOGO_PREVIEW_PATH: ${{ github.workspace }}/logo-preview.png
        run: |
          set -o pipefail
          xvfb-run -a godot --windowed --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://scripts/ci/logo_render_smoke.gd 2>&1 | tee godot-logo.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-logo.log; then
            echo "::error::Godot logo rendering produced an error"
            exit 1
          fi

      - name: Upload logo preview
        uses: actions/upload-artifact@v4
        with:
          name: pardex-logo-preview
          path: logo-preview.png
          if-no-files-found: error
