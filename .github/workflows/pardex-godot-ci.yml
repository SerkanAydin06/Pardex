name: PARDEX Godot CI

on:
  push:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "tools/package_windows.ps1"
      - "tools/pardex_installer.iss"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "themes/**"
      - "tests/visual/**"
      - ".github/workflows/pardex-godot-ci.yml"
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "tools/package_windows.ps1"
      - "tools/pardex_installer.iss"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "themes/**"
      - "tests/visual/**"
      - ".github/workflows/pardex-godot-ci.yml"

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          csharp: false
          export-templates: false

      - name: Import PARDEX resources
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-import.log; then
            echo "::error::Godot import produced an error"
            exit 1
          fi

      - name: Validate PARDEX resources
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci/validate_project.gd 2>&1 | tee godot-validate.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-validate.log; then
            echo "::error::Godot resource validation produced an error"
            exit 1
          fi

      - name: Boot PARDEX headlessly
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci/boot_smoke.gd 2>&1 | tee godot-boot.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-boot.log; then
            echo "::error::Godot boot produced a script or runtime error"
            exit 1
          fi

      - name: Verify independent distribution
        run: |
          set -o pipefail
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . --script res://scripts/ci/distribution_smoke.gd 2>&1 | tee distribution-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' distribution-smoke.log; then exit 1; fi

      - name: Verify voice call codec
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci/voice_codec_smoke.gd 2>&1 | tee voice-codec.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' voice-codec.log; then exit 1; fi
          godot --headless --path . --script res://scripts/ci/voice_jitter_smoke.gd 2>&1 | tee voice-jitter.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' voice-jitter.log; then exit 1; fi

      - name: Verify editor page preview layouts
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci/editor_preview_smoke.gd 2>&1 | tee godot-preview.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-preview.log; then
            echo "::error::Godot page preview validation produced an error"
            exit 1
          fi

      - name: Install software-rendering display
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Render PARDEX logo effects
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PARDEX_LOGO_PREVIEW_PATH: ${{ github.workspace }}/logo-preview.png
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --windowed --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://scripts/ci/logo_render_smoke.gd 2>&1 | tee godot-logo.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-logo.log; then
            echo "::error::Godot logo rendering produced an error"
            exit 1
          fi

      - name: Verify and render game detail page
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/pardex-detail-data
          PARDEX_VISUAL_OUTPUT: ${{ github.workspace }}/visual-current
        run: |
          set -o pipefail
          mkdir -p "$PARDEX_VISUAL_OUTPUT"
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --windowed --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://scripts/ci/game_details_smoke.gd 2>&1 | tee godot-details.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-details.log; then exit 1; fi

      - name: Compare pages with visual references
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          XDG_DATA_HOME: ${{ runner.temp }}/pardex-visual-data
          PARDEX_VISUAL_OUTPUT: ${{ github.workspace }}/visual-current
        run: |
          set -o pipefail
          mkdir -p "$PARDEX_VISUAL_OUTPUT"
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --windowed --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://scripts/ci/visual_regression.gd 2>&1 | tee godot-visual.log
          if grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' godot-visual.log; then
            echo "::error::Pages differ from tests/visual references (see pardex-ui-preview artifact)"
            exit 1
          fi

      - name: Upload logo preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pardex-ui-preview
          path: |
            logo-preview.png
            divider-*.png
            shell-preview-*.png
            visual-current/*.png
          if-no-files-found: warn

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Windows Godot and matching export templates
        shell: pwsh
        run: |
          $release = "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable"
          Invoke-WebRequest "$release/Godot_v4.7.1-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          "GODOT_EXE=$env:RUNNER_TEMP/godot/Godot_v4.7.1-stable_win64_console.exe" >> $env:GITHUB_ENV
          Invoke-WebRequest "$release/Godot_v4.7.1-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          $destination = "$env:APPDATA/Godot/export_templates/4.7.1.stable"
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" $destination -Recurse
      - name: Import launcher resources
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed" }
      - name: Build standalone launcher installer
        shell: pwsh
        run: |
          ./tools/package_windows.ps1 -GodotExe $env:GODOT_EXE -DistributionUrl "https://pardex-distribution.srknydn88.workers.dev"
          if (!(Test-Path "dist/PARDEX-Setup.exe")) { throw "Installer was not built" }
          if (Test-Path "dist/PARDEX-Windows/games") { throw "Games must not be bundled" }
          $config = Get-Content "dist/PARDEX-Windows/pardex-distribution.json" -Raw | ConvertFrom-Json
          if ($config.url -ne "https://pardex-distribution.srknydn88.workers.dev") { throw "Incorrect distribution URL" }
      - name: Boot exported Windows launcher
        shell: pwsh
        run: |
          $bootLog = Join-Path $env:RUNNER_TEMP "pardex-export-boot.log"
          $bootArgs = '--headless --quit-after 10 --log-file "{0}"' -f $bootLog
          $process = Start-Process -FilePath "$pwd/dist/PARDEX-Windows/PARDEX.exe" -ArgumentList $bootArgs -WorkingDirectory "$pwd/dist/PARDEX-Windows" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Exported launcher failed" }
          if (!(Test-Path $bootLog)) { throw "Boot log missing" }
          Get-Content $bootLog
          if (Select-String -Path $bootLog -Pattern 'SCRIPT ERROR:|ERROR:|Parse Error:') { throw "Exported launcher logged errors" }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PARDEX-Windows
          path: |
            dist/PARDEX-Setup.exe
            dist/PARDEX-Windows.zip
