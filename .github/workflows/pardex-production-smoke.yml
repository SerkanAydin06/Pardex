name: PARDEX Online Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - "server/server.js"
      - "server/server_core.js"
      - "server/social_store.js"
      - "server/package.json"
      - "server/package-lock.json"
      - "server/Dockerfile"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: pardex-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Allow Railway rollout after server push
        if: github.event_name == 'push'
        run: sleep 45

      - name: Test live PARDEX Online
        env:
          PARDEX_ONLINE_URL: wss://pardex-online-production.up.railway.app
          PARDEX_GAME_SERVER_URL: wss://korsan-game-production.up.railway.app
        run: node production_smoke_test.js
