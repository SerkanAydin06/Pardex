name: PARDEX Online Production Smoke

# Railway servisi kullanılmıyor (PARDEX artık host/ paneliyle ev bilgisayarından
# açılıyor). Eski canlı servisi denemek gerekirse yalnızca elle çalıştırılır.
on:
  workflow_dispatch:

concurrency:
  group: pardex-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify Railway deploy when applicable and test live PARDEX Online
        env:
          PARDEX_ONLINE_URL: wss://pardex-online-production.up.railway.app
          PARDEX_GAME_SERVER_URL: wss://korsan-game-production.up.railway.app
          # Railway only redeploys pardex-online for server/** changes. Exact SHA
          # verification is therefore valid for server push runs, but scheduled
          # and manual health checks must test the currently deployed service.
          EXPECTED_DEPLOY_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
          DEPLOYMENT_WAIT_MS: "240000"
        run: node production_smoke_test.js
