name: PARDEX Online CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/pardex-online-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/pardex-online-ci.yml"

jobs:
  server-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.js

      - name: Run two-client smoke test
        run: npm test

      - name: Build deployable container
        run: docker build -t pardex-online-ci .
